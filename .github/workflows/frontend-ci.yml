name: OrbitFlow Frontend CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: ritiksuteri/orbitflow-frontend

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git SHA
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ steps.vars.outputs.TAG }} \
            .

      # - name: Scan Docker Image
      #   uses: aquasecurity/trivy-action@v0.35.0
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
      #     format: table
      #     exit-code: "1"
      #     ignore-unfixed: true
      #     severity: HIGH,CRITICAL

      - name: Push Docker Image
        run: |
          docker push \
            $IMAGE_NAME:${{ steps.vars.outputs.TAG }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Kubernetes Deployment
        working-directory: .
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' \
            k8s/frontend-deployment.yml

      - name: Configure Git
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Manifest
        working-directory: .
        run: |
          git add k8s/frontend-deployment.yml
          git commit -m "ci: update frontend image to ${{ steps.vars.outputs.TAG }}" || echo "Nothing to commit"

      - name: Push Changes
        working-directory: .
        run: |
          git push origin main