apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitflow-frontend
  namespace: orbitflow
spec:
  replicas: 2

  selector:
    matchLabels:
      app: orbitflow-frontend

  template:
    metadata:
      labels:
        app: orbitflow-frontend

    spec:
      containers:
        - name: frontend
          image: ritiksuteri/orbitflow-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "250m"