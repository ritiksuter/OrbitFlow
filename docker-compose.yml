services:
  backend:
    image: ritiksuteri/orbitflow-backend:latest
    container_name: orbitflow-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    image: ritiksuteri/orbitflow-frontend:latest
    container_name: orbitflow-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend